
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informasi Kampus</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #243047;
            background-color: #f3f6fb;
        }

        header {
            background-color: #123b70;
            color: white;
            padding: 24px;
            text-align: center;
        }

        nav {
            background-color: #0b2545;
            padding: 14px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        nav a:hover {
            color: #ffd166;
        }

        main {
            max-width: 900px;
            margin: 25px auto;
            padding: 0 20px;
        }

        section {
            background-color: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        footer {
            background-color: #0b2545;
            color: white;
            text-align: center;
            padding: 16px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Informasi Kampus</h1>
        <p>Informasi kegiatan dan berita terbaru mahasiswa</p>
    </header>

    <nav aria-label="Navigasi utama">
        <a href="#berita">Berita</a>
        <a href="#kegiatan">Kegiatan</a>
    </nav>

    <main>
        <section id="berita">
            <h2>Berita Kampus</h2>
            <img
                src="https://placehold.co/800x300?text=Berita+Kampus"
                alt="Ilustrasi berita kampus"
            >
            <p>Buku baru telah tersedia di perpustakaan kampus.</p>
        </section>

        <section id="kegiatan">
            <h2>Kegiatan Mahasiswa</h2>
            <ul>
                <li>Pendaftaran Coding Day telah dibuka.</li>
                <li>Mahasiswa dapat mengikuti kegiatan organisasi.</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Informasi Kampus</p>
    </footer>
</body>
</html>
